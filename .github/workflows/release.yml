name: Release

# Cut a Foundry-installable release whenever a v* tag is pushed.
# Builds a flat module.zip and attaches it + module.json as release assets, so
# the "latest" manifest URL always resolves:
#   https://github.com/willisterman/investigation-board-journal-notes/releases/latest/download/module.json

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # An unparseable script still shows as "enabled" in Foundry while none of
      # its hooks run (see skill-aware-journals v0.1.1). Fail the release instead.
      - name: Syntax-check the module script
        run: node --check scripts/main.js

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into module.json
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ steps.v.outputs.version }}" '.version = $v' module.json > "$tmp"
          mv "$tmp" module.json

      - name: Build module.zip (files at archive root)
        run: zip -r module.zip module.json scripts README.md LICENSE

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
